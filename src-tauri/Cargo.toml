[package]
name = "glory-evolution"
version = "0.3.0"
description = "GloryEvolution: voice typing for any Windows app, powered by OpenRouter."
authors = ["Jinda Li"]
license = "MIT"
edition = "2021"

[lib]
name = "glory_evolution_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.15"
dirs = "6"
hound = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
